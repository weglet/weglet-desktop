[package]
name = "weglet-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "weglet_ffi"
# A shared library, not a staticlib. A staticlib carries its own copy of
# Rust's std, and a build with is_component_build=false links Chromium's
# in-tree std into weglet.exe as well: the link fails on duplicate std
# symbols such as rust_eh_personality. Inside weglet_ffi.dll the second
# std stays private to the library.
# Rejected: building these crates with GN's Rust support on Chromium's std,
# because every crates.io dependency in Cargo.lock would need a
# hand-maintained GN target.
#
# The rlib alongside it is for the tests under tests/, which bind the
# entry points with the types weglet_ffi.h declares -- so a signature that
# drifts from the header fails to compile in `cargo test` rather than
# becoming undefined behaviour in the browser. Nothing ships it;
# build_rust.py copies the shared library and ignores this.
crate-type = ["cdylib", "rlib"]

[dependencies]
weglet-core = { path = "../weglet-core" }
weglet-url = { path = "../weglet-url" }
weglet-profile = { path = "../weglet-profile" }
weglet-security = { path = "../weglet-security" }

[lints.rust]
# The whole point of this crate. Every block carries a SAFETY comment.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
