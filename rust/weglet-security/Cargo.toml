[package]
name = "weglet-security"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
# For the brand table in data/brands.toml. The rules used to be a const
# array in risk.rs, so adding a brand meant editing Rust and rebuilding.
serde = { version = "1", features = ["derive"] }
toml = "1"
idna = "1"
# The Public Suffix List, compiled in. Without it "blog.google" and
# "google.co.nz" cannot be told apart from an impostor, and both get
# blocked as one.
psl = "2"
url = "2"

[lints]
workspace = true
